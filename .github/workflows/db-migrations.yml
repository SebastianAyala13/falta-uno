name: Migraciones de base de datos (prod)

# Aplica las migraciones pendientes de supabase/migrations/ a producción.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUÉ ESTO YA NO ES AUTOMÁTICO
# ─────────────────────────────────────────────────────────────────────────────
# Antes este workflow corría `supabase db push` solo porque un merge a main
# tocaba supabase/migrations/. Eso es cambiar el esquema de producción sin
# respaldo, sin ensayo y sin que nadie mire — y al mismo tiempo que Dokploy
# reconstruye el cliente por su lado, que es una carrera que nadie controla.
# Peor todavía: una migración puede fallar a mitad si los datos que ya existen
# tienen conflictos, y revertir el commit NO revierte la migración.
#
# Ahora el push a main solamente AVISA. Aplicar es una acción manual y
# explícita: Actions → este workflow → "Run workflow", escribiendo la
# confirmación. El orden correcto es respaldo → ensayo en staging → aplicar
# acá → desplegar Edge Functions → publicar cliente.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTENTICACIÓN
# ─────────────────────────────────────────────────────────────────────────────
# Un único secret del repo, SUPABASE_DB_URL = el connection string del
# **Session pooler** (Dashboard → Settings → Database → Connection string →
# Session pooler → URI), con la DB password embebida. Es una credencial
# project-scoped (solo esta base) y rotable (reseteás la password cuando
# quieras). Las Edge Functions y sus secretos NO se despliegan acá.

on:
  # Aviso, no aplicación.
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'

  # La única vía para tocar producción.
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribí exactamente: aplicar a produccion'
        required: true
        type: string
      solo_ensayo:
        description: 'Solo mostrar qué se aplicaría, sin aplicar nada'
        required: false
        default: true
        type: boolean

# Least privilege: estos jobs solo necesitan leer el repo.
permissions:
  contents: read

# Nunca correr dos db push en paralelo contra la misma base.
concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Entró una migración a main: avisar, y nada más.
  # ───────────────────────────────────────────────────────────────────────────
  avisar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resumir lo que entró
        env:
          ANTERIOR: ${{ github.event.before }}
          ACTUAL: ${{ github.sha }}
        run: |
          {
            echo "## Migraciones nuevas en main"
            echo
            # En el primer push de una rama, `before` viene en ceros y no hay
            # rango que comparar: mostramos el último commit solo.
            if [ -z "${ANTERIOR//0/}" ]; then
              RANGO="${ACTUAL}^!"
            else
              RANGO="${ANTERIOR}..${ACTUAL}"
            fi
            git diff --name-only "$RANGO" -- supabase/migrations/ supabase/config.toml \
              | sed 's/^/- /' || true
            echo
            echo "**No se aplicó nada a producción.**"
            echo
            echo "Para aplicarlas: Actions → *Migraciones de base de datos (prod)*"
            echo "→ Run workflow. Primero con \`solo_ensayo\` activado para ver el plan,"
            echo "y después desactivándolo. Antes de eso: respaldo y ensayo en staging."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Aplicación manual.
  # ───────────────────────────────────────────────────────────────────────────
  aplicar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Si además querés que otra persona apruebe, creá el environment
    # "produccion" en Settings → Environments y agregale required reviewers.
    environment: produccion
    steps:
      # Una confirmación escrita a mano evita el "Run workflow" por reflejo.
      - name: Verificar la confirmación
        env:
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          if [ "$CONFIRMACION" != "aplicar a produccion" ]; then
            echo "La confirmación no coincide. Escribí exactamente: aplicar a produccion"
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      # Preflight: los conflictos en los datos que ya existen son la causa más
      # probable de que una migración falle a mitad.
      #
      # El script es de solo lectura y SOLO INFORMA: devuelve una fila por tipo
      # de conflicto con su cantidad, y termina bien aunque encuentre alguno. La
      # decisión de cortar es de acá, para que el corte ocurra antes del push y
      # no a mitad de una migración.
      - name: Preflight de conflictos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ ! -f scripts/preflight-fiabilidad.sql ]; then
            echo "No hay scripts/preflight-fiabilidad.sql; nada que verificar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! command -v psql >/dev/null 2>&1; then
            echo "psql no está disponible en el runner; no se pudo correr el preflight."
            exit 1
          fi
          # -qAt: una línea por tipo, campos separados por '|' -> tipo|cantidad|detalles
          SALIDA=$(psql -X -qAt -v ON_ERROR_STOP=1 -f scripts/preflight-fiabilidad.sql "$SUPABASE_DB_URL")
          {
            echo "## Preflight de conflictos"
            echo '```'
            echo "$SALIDA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if printf '%s\n' "$SALIDA" | awk -F'|' 'NF>1 && $2+0>0 {hay=1} END {exit !hay}'; then
            echo "El preflight encontró conflictos en los datos. No se aplica nada."
            echo "Resolvelos con sus responsables; no se borran registros automáticamente."
            exit 1
          fi
          echo "Sin conflictos."

      # Ensayo: muestra qué migraciones se aplicarían, sin tocar nada.
      - name: Ensayo (dry run)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          {
            echo "## Migraciones que se aplicarían"
            echo '```'
            supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Aplicar migraciones pendientes
        if: ${{ !inputs.solo_ensayo }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Aviso de ensayo
        if: ${{ inputs.solo_ensayo }}
        run: |
          echo "Fue un ensayo: no se aplicó nada. Volvé a correrlo con \`solo_ensayo\` desactivado." >> "$GITHUB_STEP_SUMMARY"
